<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:; img-src 'self' data:">
  <title>Herald</title>
  <!-- Janela separada da transmissão: o app principal entrega o vídeo pra cá -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .barra { position: fixed; inset: 0 0 auto 0; height: 40px; -webkit-app-region: drag; }
    .quem {
      position: fixed; left: 14px; top: 12px; z-index: 2; padding: 4px 10px; border-radius: 8px; background: #000a;
      color: #f4f2f8; font: 700 13px system-ui, sans-serif; transition: opacity .3s; pointer-events: none;
    }
    .quem i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f27a6a; margin-right: 6px; }
    body.parado .quem { opacity: 0; }
  </style>
</head>
<body>
  <div class="barra"></div>
  <div class="quem"><i></i><span id="nome"></span></div>
  <video id="video" autoplay playsinline></video>
</body>
</html>
